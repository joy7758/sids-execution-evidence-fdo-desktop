  <rect x="88" y="342" width="158" height="52" rx="26" fill="#e9efe6"/>
  <text x="124" y="375" font-size="18" font-weight="800">中文</text>
  <text x="202" y="375" font-size="18" fill="#506358">EN</text>
  <rect x="82" y="442" width="210" height="90" rx="18" fill="#3b5949" stroke="#6f8a7a"/>
  <circle cx="118" cy="487" r="21" fill="#597363"/>
  <text x="112" y="494" font-size="18" fill="#fff">1</text>
  <text x="154" y="476" font-size="16" font-weight="800" fill="#fff">监测首页</text>
  <text x="154" y="502" font-size="14" fill="#dbe5dd">先看系统是否已经发现</text>
