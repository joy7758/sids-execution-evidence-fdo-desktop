  <text class="body" x="448" y="626">这里只展示产品内检查维度，不给出法律认证结论。</text>
  <rect class="ok" x="448" y="656" width="146" height="42" rx="21"/>
  <text class="tag" x="476" y="683">运行留痕</text>
  <rect class="ok" x="616" y="656" width="146" height="42" rx="21"/>
  <text class="tag" x="644" y="683">校验回执</text>
  <rect class="ok" x="784" y="656" width="146" height="42" rx="21"/>
  <text class="tag" x="812" y="683">审阅交付</text>
  <rect class="ok" x="952" y="656" width="146" height="42" rx="21"/>
  <text class="tag" x="986" y="683">PDF 报告</text>
  <rect class="soft" x="1120" y="656" width="146" height="42" rx="21"/>
  <text x="1148" y="683" font-size="14" fill="#536258">暂不需要</text>

  <rect class="card" x="408" y="754" width="936" height="92" rx="22"/>
  <text class="h2" x="448" y="808">查看文件详情</text>
  <text class="body" x="448" y="838">技术路径默认折叠，需要排查时再展开。</text>
  <rect class="secondary" x="1148" y="774" width="138" height="52" rx="26"/>
